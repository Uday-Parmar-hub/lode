<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="LODE — royalty origination from technical reports">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12131a"/>
      <stop offset="1" stop-color="#0b0c11"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7893f"/>
      <stop offset="0.5" stop-color="#e9c877"/>
      <stop offset="1" stop-color="#b7893f"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c877" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e9c877" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e9c877" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- rock strata: the technical-report substrate LODE reads through -->
  <g stroke="#2a2c36" stroke-width="1.5" opacity="0.7">
    <line x1="0" y1="52" x2="1200" y2="40"/>
    <line x1="0" y1="96" x2="1200" y2="108"/>
    <line x1="0" y1="150" x2="1200" y2="138"/>
    <line x1="0" y1="196" x2="1200" y2="206"/>
    <line x1="0" y1="232" x2="1200" y2="224"/>
  </g>

  <!-- the lode: a gold vein cutting the strata (the royalty found in the rock) -->
  <path d="M -20 250 L 380 120 L 560 168 L 900 30 L 1230 78" fill="none" stroke="url(#vein)" stroke-width="3.5"/>
  <g fill="#e9c877">
    <circle cx="380" cy="120" r="3.2"/>
    <circle cx="560" cy="168" r="3.2"/>
    <circle cx="900" cy="30" r="3.2"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="6" fill="url(#gold)">LODE</text>
  <text x="78" y="192" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="21" letter-spacing="1" fill="#d7dae3">Royalty origination from technical reports</text>
  <text x="80" y="96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="13" letter-spacing="5" fill="#8a7a4e">OR ROYALTIES · TOOL 2</text>

  <!-- a lode is a vein of ore; the tool finds the royalty in the rock -->
  <text x="1128" y="238" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#5b5e6b">n. a rich vein of ore</text>
</svg>
